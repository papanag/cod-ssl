experiment:
  seed: 42
  input_size: 384
model:
  backbone:
    name: PLACEHOLDER
    layers: [2, 5, 8, 11]
  decoder:
    name: common_cod_decoder
    projection_dim: 128
loss:
  name: bce_soft_iou
  smooth: 1.0
data:
  train_manifest: manifests/train_all.csv
  batch_size: 4
  num_workers: 2
training:
  epochs: 40
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  gradient_accumulation_steps: 4
  amp: true
  amp_dtype: auto
  grad_clip_norm: 1.0
  checkpoint_every: 1
evaluation:
  manifests:
    camo_test: manifests/camo_test.csv
    cod10k_test: manifests/cod10k_test.csv
    chameleon: manifests/chameleon.csv
    nc4k: manifests/nc4k.csv
  batch_size: 1
  num_workers: 2
  minmax_normalize: true
  save_predictions: true
